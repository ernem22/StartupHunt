# SearXNG — StartupHunt örneği
# JSON API açık, bot koruması limiter'ı kapalı (lokal kullanım, FAZ 14 catch-up ayarı)

use_default_settings: true

server:
  base_url: false
  secret_key: "ultra-secret-key-change-me"   # 3060 kurulumunda .env'e SEARXNG_SECRET girilerek değiştirilir (port 127.0.0.1'e bağlı → lokal dışına kapalı; CodeRabbit)
  limiter: false   # lokal; tek istemci kendimiziz (public exposure YASAK)
  image_proxy: true

search:
  formats:
    - html
    - json          # FAZ 14 için şart
  default_lang: tr   # CodeRabbit: bu alan 'language' değil (TR varsayılan arama dili)

# Upstream motorlarda bot koruması toleranslı olanlar öncelikli (plan v3.1, Açık Soru 5)
engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false
  - name: google
    disabled: false   # açık ama uzun koşuda block izlenir; nazik hız şart
  - name: bing
    disabled: false
