name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: startuphunt
          POSTGRES_PASSWORD: startuphunt
          POSTGRES_DB: startuphunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U startuphunt -d startuphunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://startuphunt:startuphunt@127.0.0.1:5432/startuphunt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply schema
        run: PGPASSWORD=startuphunt psql -h 127.0.0.1 -U startuphunt -d startuphunt -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: pnpm typecheck
      - run: pnpm check:encoding
      - name: Test
        shell: bash
        run: |
          if node -e "process.exit((require('./package.json').scripts||{}).test ? 0 : 1)"; then
            pnpm test
          else
            echo "test script yok; #19 merge edilince etkinleşecek."
          fi
